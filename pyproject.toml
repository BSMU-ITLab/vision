[build-system]
requires = [ 'setuptools >= 69.0' ]
build-backend = 'setuptools.build_meta'

[project]
name = 'bsmu.vision'
dynamic = [ 'version' ]
description = 'Base data processing application for extension by plugins'
readme = 'README.md'
requires-python = '>= 3.11'
license = { file = 'LICENSE' }
authors = [
    { name = 'Ivan Kosik', email = 'ivankosik91@gmail.com' },
]
keywords = [
    'plugin system',
    'image processing',
    'annotation',
    'masking',
    'medical imaging',
    'image analysis',
    'computer vision',
]
classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: BSD License',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Operating System :: OS Independent',
    'Topic :: Software Development :: Version Control :: Git',
]
dependencies = [
    'PySide6>=6.5',
    'ruamel.yaml>=0.17',
]

[project.urls]
Homepage = 'https://github.com/BSMU-ITLab/vision'
Repository = 'https://github.com/BSMU-ITLab/vision.git'
Issues = 'https://github.com/BSMU-ITLab/vision/issues'

[project.scripts]
bsmu-vision-c = 'bsmu.vision.app.main:run_app'

[project.gui-scripts]
bsmu-vision = 'bsmu.vision.app.main:run_app'

[project.optional-dependencies]
common = [
    'numpy',
    'opencv-python',
    'scikit-image',
    'scipy',
    'sortedcontainers',
]
nn_inference = [ 'onnxruntime-gpu' ]
data_analysis = [ 'pandas' ]

# Dependencies for handling various file formats
nifti = [ 'nibabel' ]
dicom = [ 'pydicom' ]
wsi = [
    'slideio',
    'tifffile',
]
pdf = [ 'pypdfium2' ]

# Repo-local dev tools
# TODO: move to [dependency-groups] (PEP 735) once pip >= 25.1
dev = [
    'pytest>=8',
    'ruff==0.17.4',  # Keep equal to pre-commit hook rev
    'pre-commit>=4',
    'cx-Freeze==7.2.5',
]

[tool.setuptools.dynamic]
version = { attr = 'bsmu.vision.__version__' }

[tool.setuptools.packages.find]
where = [ 'src' ]

[tool.setuptools.package-data]
'*' = [ '**/*.conf.yaml' ]

[tool.ruff]
line-length = 120
extend-exclude = [
    'temp',
    '*_rc.py',  # E.g. icons_rc.py
]

[tool.ruff.lint]
future-annotations = true
select = [
    'E',  # pycodestyle errors
    'W',  # pycodestyle warnings
    'F',  # Pyflakes
    'I',  # isort
    'UP',  # pyupgrade
    'B',  # flake8-bugbear
    'SIM',  # flake8-simplify
    'C4',  # flake8-comprehensions
    'TC',  # flake8-type-checking
    # TODO: switch to full 'N' on Python 3.12 (typing.override for Qt methods)
    'N999',  # Module names
    'N801',  # Class names
    'N818',  # Exception names
]
ignore = [
    'E501',  # Line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
'__init__.py' = ['F401']  # Allow unused imports for re-exports

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    'PySide6.QtCore.QModelIndex',
]

[tool.ruff.format]
quote-style = 'single'
