plugins:
  - bsmu.vision.plugins.windows.main.MainWindowPlugin
  - bsmu.vision.plugins.layouts.mdi.MdiLayoutPlugin

  - bsmu.vision.plugins.file_dropper.FileDropperPlugin
  - bsmu.vision.plugins.io.raster.common.CommonRasterFileReaderPlugin
  - bsmu.vision.plugins.io.raster.wsi.WholeSlideRasterFileReaderPlugin
#  - bsmu.vision.plugins.io.raster.nifti.NiftiRasterFileReaderPlugin

  - bsmu.vision.plugins.postread.raster_to_layered.RasterToLayeredDataPostReadConverterPlugin

  - bsmu.vision.plugins.visualizers.raster.flat.FlatRasterVisualizerPlugin
#  - bsmu.vision.plugins.visualizers.raster.volume.VolumeRasterVisualizerPlugin
  - bsmu.vision.plugins.visualizers.layered.LayeredDataVisualizerPlugin

  - bsmu.vision.plugins.overlayers.image.ImageViewerOverlayerPlugin
  - bsmu.vision.plugins.overlayers.path.ImageViewerPathOverlayerPlugin
#  - bsmu.vision.plugins.overlayers.intersection.ImageViewerIntersectionOverlayerPlugin

  - bsmu.vision.plugins.io.raster.common.CommonRasterFileWriterPlugin

  - bsmu.vision.plugins.layers_view.LayersTableViewPlugin
  - bsmu.vision.plugins.task_storage_view.TaskStorageViewPlugin

  - bsmu.vision.plugins.tools.manager.ViewerToolManagerPlugin
  - bsmu.vision.plugins.tools.hand.HandToolPlugin
#  - bsmu.vision.plugins.tools.smart_brush.SmartBrushToolPlugin
  - bsmu.vision.plugins.tools.wsi_smart_brush.WsiSmartBrushToolPlugin
  - bsmu.vision.plugins.tools.pointer.PointerToolPlugin
  - bsmu.vision.plugins.tools.polyline.PolylineToolPlugin

  - bsmu.vision.plugins.walkers.file.MdiImageLayerFileWalkerPlugin
#  - bsmu.vision.plugins.walkers.mask_auto_save.MaskAutoSaveOnWalkPlugin
#  - bsmu.vision.plugins.walkers.slice.MdiVolumeSliceWalkerPlugin

  - bsmu.vision.plugins.layer_controller.MdiImageViewerLayerControllerPlugin

enable_gui: true

max_general_thread_count: null  # If null, then `QThread.idealThreadCount() - max_dnn_thread_count` will be used
max_dnn_thread_count: 1

warn_with_traceback: false

onnx_providers:
  - CUDAExecutionProvider
  - CPUExecutionProvider

opencv_io_max_image_pixels: 1_099_511_627_776  # 1 TB = 2 ^ 40 bytes
